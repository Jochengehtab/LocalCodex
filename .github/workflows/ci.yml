name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-local-codex.txt
      - run: python -m pip install -r requirements-local-codex.txt
      - run: python -m compileall -q local_codex local_search start_codex.py
      - run: python -m unittest discover -s tests -v
        env:
          LOCAL_CODEX_LIVE_TESTS: "0"
      - name: Version consistency
        run: python -c "from local_codex.releases import CURRENT_VERSION; assert CURRENT_VERSION == open('VERSION').read().strip()"

  monitor:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y ninja-build
          libgl1-mesa-dev libx11-dev libxext-dev libxcursor-dev libxi-dev
          libxrandr-dev libxinerama-dev libxss-dev libxtst-dev libasound2-dev
      - name: Configure
        run: cmake -S . -B build -DLOCALCODEX_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Native tests
        run: ctest --test-dir build -C Release --output-on-failure

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: SEARXNG_SECRET=ci-only docker compose -f local_search/docker-compose.yml config --quiet
